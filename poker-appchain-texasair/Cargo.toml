[package]
name = "poker-appchain-texasair"
version = "0.1.0"
edition = "2024"
description = "接入缝：poker-appchain 结算证明 ↔ poker_texas_air 手写约束 AIR（stwo circle-STARK）"
license = "BUSL-1.1"

# 独立 crate（自带 lockfile）：外部 poker_texas_air 携带自己的 poker_l1，
# 与 zchain workspace 的 poker_l1 同名不同源，不能共享依赖图。
[workspace]

[dependencies]
# ===== zchain 侧：结算证明 seam =====
poker-appchain = { path = "../poker-appchain" }
# ===== E2E 验收测试用：结算计划派生（derive_settlement_plan 纯函数，
# poker-appchain 的 SettlementRecord.plan 同源类型）=====
poker-settlement-core = { path = "../poker-settlement-core" }
# ===== poker_texas_air 侧：手写约束 AIR 全量栈 =====
poker_texas_air = { path = "../../poker_texas_air" }
# ===== shuffle 链两侧对照测试（tests/shuffle_stage0_consume.rs）直连的
# 上游子 crate：TableRules（poker_l1，与 poker_texas_air 同 path/版本）与
# curve/标量类型（poker_protocol）。**版本与 poker_texas_air 的依赖完全
# 同源**——Cargo.lock 零新包（同一 path/版本已在其依赖闭包内）。
poker_l1 = { path = "../../poker_texas_air/poker_l1" }
poker_protocol = { path = "../../poker_texas_air/poker_protocol", features = ["borsh"] }
# ===== shuffle-chain 生产者 RNG（上游同版本 0.8，lock 内既有）=====
rand = "0.8.5"
# ===== 编码与签名 =====
borsh = "1"
hex = "0.4.3"
ed25519-dalek = "2.1.1"

[lib]
path = "src/lib.rs"
