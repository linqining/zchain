[package]
name = "poker_texas_air"
version = "0.1.0"
edition = "2024"
description = "Texas Poker method AIR + application-aware native STWO recursion verifier"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
# Enable only the production-facing recursive verifier adapter. L1 nodes use
# this feature so they do not expose or link the recursive prover entry point.
recursive-verifier = ["poker_zkvm/recursive-verifier"]
# Enable the recursive prover as well; proving implies verification.
recursive-prover = ["recursive-verifier", "poker_zkvm/recursive-prover"]
# 保留 Aggregator PoC 配置；生产 prove/verify 默认拒绝 descriptor-only 聚合
aggregator = []
# 测试辅助：暴露不可信负向测试工具；lib.rs 禁止其进入 release 构建
test-helpers = []

[dependencies]
# ===== 工作区内复用 =====
poker_l1 = { path = "../poker_l1" }
poker_zkvm = { workspace = true }
poker_protocol = { workspace = true }
vm-common = { path = "../vm-common" }
# ===== Stwo 证明后端（与 poker_zkvm 同版本）=====
stwo = { workspace = true }
stwo-air-utils = { workspace = true }
stwo-air-utils-derive = { workspace = true }
stwo-constraint-framework = { workspace = true }
# Poseidon252 哈希（state_root 用）— 必须与 Stwo 同版本（0.6.x），
# 否则 starknet_crypto::poseidon_hash_many 的 Felt 类型与
# starknet_ff::FieldElement 不兼容。
starknet-ff = { workspace = true }
starknet-crypto = { workspace = true }
# ===== 通用依赖 =====
borsh = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
blake2 = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }
# BLS12-381（密码学方法 AIR 用）
blstrs = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
pairing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
secp256k1 = { workspace = true }
poker_texas_air = { path = ".", features = ["test-helpers"] }
poker_zkvm = { workspace = true, features = ["experimental-cpu-prover"] }
