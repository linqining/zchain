[package]
name = "poker_texas_air"
version = "0.1.0"
edition = "2024"
description = "Texas Poker 自定义电路 + Aggregator AIR — 业务语义直接电路化，二叉树递归聚合到单证明"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
# 启用 Aggregator 二叉树聚合（依赖 poker_zkvm recursive 模块）
aggregator = []
# 测试辅助：暴露 soundness 负向测试工具
test-helpers = []

[dependencies]
# ===== 工作区内复用 =====
poker_l1 = { path = "../poker_l1" }
poker_zkvm = { path = "../../poker_zkvm" }
poker_protocol = { workspace = true }
vm-common = { path = "../vm-common" }
# ===== Stwo 证明后端（与 poker_zkvm 同版本）=====
stwo = { workspace = true }
stwo-air-utils = { workspace = true }
stwo-air-utils-derive = { workspace = true }
stwo-constraint-framework = { workspace = true }
# Poseidon252 哈希（state_root 用）— 必须与 Stwo 同版本（0.6.x），
# 否则 starknet_crypto::poseidon_hash_many 的 Felt 类型与
# starknet_ff::FieldElement 不兼容。
starknet-ff = { workspace = true }
starknet-crypto = { workspace = true }
# ===== 通用依赖 =====
borsh = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
blake2 = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }
# BLS12-381（密码学方法 AIR 用）
blstrs = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
pairing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
poker_texas_air = { path = ".", features = ["test-helpers"] }
