[package]
name = "proving_service"
version = "0.1.0"
edition = "2024"
description = "链下 Texas Poker 证明服务：持久化 dispatch job 与可重启 method-proof archive；递归聚合尚未完成。"

[lib]
path = "src/lib.rs"

[[bin]]
name = "proving_service"
path = "src/main.rs"

[dependencies]
poker_l1 = { path = "../poker_l1" }
poker_texas_air = { path = "../poker_texas_air" }
vm-common = { path = "../vm-common" }
poker_protocol = { workspace = true }
blstrs = { workspace = true }
borsh = { workspace = true }
blake2 = { workspace = true }
group = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = { workspace = true }
# HTTP 服务（axum 框架已在 workspace 层声明）
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []

[dev-dependencies]
secp256k1 = { workspace = true }
tower = { workspace = true, features = ["util"] }
