[workspace]
resolver = "2"
members = ["poker_l1", "poker_zkvm", "vm-common"]

# zchain root package 本身作为 workspace 的 bin 入口保留
[package]
name = "zchain"
version = "0.1.0"
edition = "2024"

[dependencies]
poker_l1 = { path = "poker_l1" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["signal", "rt"] }
secp256k1 = { workspace = true }
bcs = { workspace = true }
blake2 = { workspace = true }
rand = { workspace = true }

[workspace.dependencies]
# 共享依赖集中管理，便于版本一致与升级
poker_protocol = { path = "../zgame/poker_protocol" }
poker_zkvm = { path = "poker_zkvm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcs = "0.1.6"
sha2 = "0.10.8"
sha3 = "0.10.8"
blake2 = "0.10.6"
hex = "0.4.3"
thiserror = "1.0.61"
rand = "0.8.5"
secp256k1 = { version = "0.29", features = ["recovery", "rand", "global-context"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
subtle = "2.5"
rocksdb = { version = "0.22", default-features = false }
solana_rbpf = "0.8"
blstrs = "0.7"
ff = "0.13"
group = "0.13"
pairing = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
# ===== poker_zkvm 依赖（arkworks 0.6 主线 + 工具链）=====
ark-ff = { version = "0.6", features = ["std"] }
ark-ec = { version = "0.6", features = ["std"] }
ark-poly = { version = "0.6", features = ["std"] }
ark-serialize = { version = "0.6", features = ["std"] }
ark-std = { version = "0.6", features = ["std"] }
ark-bn254 = { version = "0.6", features = ["r1cs"] }
ark-grumpkin = { version = "0.6", features = ["r1cs"] }
ark-groth16 = { version = "0.6", default-features = false, features = ["std"] }
ark-r1cs-std = { version = "0.6", default-features = false, features = ["std"] }
ark-relations = { version = "0.6", default-features = false, features = ["std"] }
ark-snark = { version = "0.6", default-features = false }
ark-crypto-primitives = { version = "0.6.0", default-features = false, features = ["crh", "std"] }
rayon = "1"
goblin = { version = "0.8", default-features = false, features = ["elf32", "elf64", "endian_fd"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
