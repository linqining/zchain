[workspace]
resolver = "2"
members = ["poker_l1", "poker_texas_air", "vm-common", "proving_service", "poker_zkvm"]

# zchain root package 本身作为 workspace 的 bin 入口保留
[package]
name = "zchain"
version = "0.1.0"
edition = "2024"

[dependencies]
poker_l1 = { path = "poker_l1" }
poker_protocol = { workspace = true }
poker_zkvm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["signal", "rt"] }
secp256k1 = { workspace = true }
bcs = { workspace = true }
borsh = { workspace = true }
blake2 = { workspace = true }
rand = { workspace = true }
blstrs = { workspace = true }
group = { workspace = true }

[workspace.dependencies]
# 共享依赖集中管理，便于版本一致与升级
poker_protocol = { path = "../zgame/poker_protocol", features = ["borsh"] }
# poker_zkvm 主 crate 已迁入本 workspace 作为 path 成员（guest_sdk / guests 暂未迁入）
poker_zkvm = { path = "poker_zkvm" }
# vm-common 是 workspace 内的共享 path 成员，集中声明以便 poker_zkvm 等成员以 workspace=true 引用
vm-common = { path = "vm-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcs = "0.1.6"
borsh = { version = "1.7", features = ["derive"] }
sha2 = "0.10.8"
sha3 = "0.10.8"
blake2 = "0.10.6"
hex = "0.4.3"
thiserror = "1.0.61"
rand = "0.8.5"
secp256k1 = { version = "0.29", features = ["recovery", "rand", "global-context"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
subtle = "2.5"
rocksdb = { version = "0.22", default-features = false }
solana_rbpf = "0.8"
blstrs = "0.7"
ff = "0.13"
group = "0.13"
pairing = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
# ===== Phase 3: zkvm 服务化 HTTP 框架 =====
axum = { version = "0.7", features = ["http1"] }
tower = { version = "0.4" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# ===== poker_zkvm 依赖（v2：仅保留 BN254 Fr 用于 Poseidon 哈希）=====
# v2 已完全放弃 Hypernova 证明系统，删除 ark-ec/ark-poly/ark-grumpkin/ark-groth16/
# ark-r1cs-std/ark-relations/ark-snark 等 R1CS/Groth16 相关依赖。
# 保留 ark-ff/ark-bn254/ark-crypto-primitives/ark-std 仅用于 BN254 Fr Poseidon 哈希。
ark-ff = { version = "0.6", features = ["std"] }
ark-std = { version = "0.6", features = ["std"] }
ark-bn254 = { version = "0.6" }
ark-crypto-primitives = { version = "0.6.0", default-features = false, features = ["crh", "std"] }
rayon = "1"
indexmap = "2.2.6"
goblin = { version = "0.8", default-features = false, features = ["elf32", "elf64", "endian_fd"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# ===== Stwo 迁移（Hypernova → Stwo）=====
# 详见 .trae/documents/hypernova_to_stwo_migration_plan.md
stwo = { version = "2.3", features = ["parallel", "prover"] }
stwo-air-utils = "2.3"
stwo-air-utils-derive = "2.3"
stwo-constraint-framework = { version = "2.3", features = ["prover"] }
# Audited Cairo AIR Poseidon252 closure. The prover crate is vendored because crates.io 1.2.2
# needs three mechanical compatibility fixes for the current nightly; see
# third_party/stwo-cairo/README.md.
cairo-air = "=1.2.2"
stwo-cairo-adapter = "=1.2.2"
stwo-cairo-common = { path = "third_party/stwo-cairo/common", features = ["prover"] }
stwo-cairo-prover = { path = "third_party/stwo-cairo/prover" }
# Starknet Poseidon252 哈希 — 必须与 Stwo 同版本（0.6.x），否则
# starknet_crypto::poseidon_hash_many 的 Felt 类型与
# starknet_ff::FieldElement 不兼容（0.8.x 改用 starknet_types_core::Felt）。
starknet-ff = { version = "0.3", features = ["serde"] }
starknet-crypto = { version = "0.6", default-features = false, features = ["alloc"] }
# Stwo StarkProof<H> 序列化用（Phase 1.3：StwoProver::prove 输出 bincode 字节流）
bincode = "1"

[patch.crates-io]
# Keep every Cairo witness crate on the reviewed 1.2.2 common implementation instead of
# compiling a second, unpatched copy from crates.io.
stwo-cairo-common = { path = "third_party/stwo-cairo/common" }
