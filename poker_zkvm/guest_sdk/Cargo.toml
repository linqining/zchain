[package]
name = "zkvm_guest_sdk"
version = "0.1.0"
edition = "2021"
description = "no_std SDK for poker_zkvm guest crates (syscalls + alloc + BLS types)"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
# host 测试模式：用 std 编译，mock syscall，便于单元测试
std-test = []

[dependencies]
borsh = { version = "1", default-features = false, features = ["derive"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
strip = true
