[package]
name = "poker_zkvm"
version = "0.1.0"
edition = "2024"
description = "ZK VM for zchain OffChain mode — Stwo Circle STARK+AIR+FRI (M31), native trace (4×8-bit limb)"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
# 测试辅助功能：启用跨 crate 测试辅助函数（如 ELF 构造、指令编码）
default = []
test-helpers = []

[dependencies]
vm-common = { path = "../vm-common" }
# ===== 应用层密码学（Poseidon 哈希，poker game 事件哈希用）=====
# 注意：v2 已完全放弃 Hypernova 证明系统，但保留 BN254 Fr 仅用于 Poseidon 哈希。
# 后续 Phase 3/4 可考虑迁移到 M31 Poseidon（Stwo 提供）。
ark-ff = { workspace = true }
ark-bn254 = { workspace = true }
ark-crypto-primitives = { workspace = true }
ark-std = { workspace = true }
# ===== 通用依赖 =====
sha2 = { workspace = true }
sha3 = { workspace = true }
secp256k1 = { workspace = true }
blake2 = { workspace = true }
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
goblin = { workspace = true }
tracing = { workspace = true }
# E2E Phase 1: BLS12-381 syscall 支持（poker 合约 G1/Scalar/Pairing 操作）
blstrs = { workspace = true }
pairing = { workspace = true }
# ===== Stwo 证明后端（v2 原生 M31 trace + AIR + FRI）=====
# 详见 .trae/documents/hypernova_to_stwo_migration_plan_v2.md
stwo = { workspace = true }
stwo-air-utils = { workspace = true }
stwo-air-utils-derive = { workspace = true }
stwo-constraint-framework = { workspace = true }
# StarkProof 序列化
bincode = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
hex = { workspace = true }
# 自引用以启用 `test-helpers` feature 供 integration tests (tests/*.rs) 使用。
poker_zkvm = { path = ".", features = ["test-helpers"] }
