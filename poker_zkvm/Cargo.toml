[package]
name = "poker_zkvm"
version = "0.1.0"
edition = "2024"
description = "ZK VM for zchain OffChain mode — Stwo Circle STARK+AIR+FRI (M31), native trace (4×8-bit limb)"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
# 测试辅助功能：启用跨 crate 测试辅助函数（如 ELF 构造、指令编码）
default = []
test-helpers = []

[dependencies]
vm-common = { path = "../vm-common" }
# ===== 应用层密码学（Poseidon 哈希，poker game 事件哈希用）=====
# 注意：v2 已完全放弃 Hypernova 证明系统，但保留 BN254 Fr 仅用于 Poseidon 哈希。
# 后续 Phase 3/4 可考虑迁移到 M31 Poseidon（Stwo 提供）。
ark-ff = { workspace = true }
ark-bn254 = { workspace = true }
ark-crypto-primitives = { workspace = true }
ark-std = { workspace = true }
# ===== 通用依赖 =====
sha2 = { workspace = true }
sha3 = { workspace = true }
secp256k1 = { workspace = true }
blake2 = { workspace = true }
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
goblin = { workspace = true }
tracing = { workspace = true }
# E2E Phase 1: BLS12-381 syscall 支持（poker 合约 G1/Scalar/Pairing 操作）
blstrs = { workspace = true }
pairing = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
subtle = { workspace = true }
# Phase 4: poker_protocol 用于 Mental Poker proof verify syscall（DLEq/ZKShuffle/RevealToken/Reconstruct）
poker_protocol = { workspace = true }
borsh = { workspace = true }
# ===== Stwo 证明后端（v2 原生 M31 trace + AIR + FRI）=====
# 详见 .trae/documents/hypernova_to_stwo_migration_plan_v2.md
stwo = { workspace = true }
stwo-air-utils = { workspace = true }
stwo-air-utils-derive = { workspace = true }
stwo-constraint-framework = { workspace = true }
# StarkProof 序列化
bincode = { workspace = true }
# Poseidon252 哈希（Merkle Path AIR 递归验证用）
starknet-ff = "0.3"
starknet-crypto = "0.8"

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
hex = { workspace = true }
# Phase 5.1: E2E 测试用 blstrs 生成有效 BLS12-381 G1 点作为玩家 pk。
# submit_shuffle_v2 的 add_pk_to_c2 会经 syscall 做真实 G1 运算，需要有效压缩点。
blstrs = { workspace = true }
pairing = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
# 自引用以启用 `test-helpers` feature 供 integration tests (tests/*.rs) 使用。
poker_zkvm = { path = ".", features = ["test-helpers"] }
# Phase 5: guest crate 作为 dev-dependency，使 E2E 测试可直接构造 ZkvmInput/ZkvmOutput
# 等类型（borsh 序列化），而不需手动拼装 bytes。std-test feature 使 guest crate 以 host std 编译。
texas_poker_guest = { path = "guests/texas_poker", features = ["std-test"] }

# Phase 5.2/5.3: 完整一手牌性能基准 + MVP 对比（custom harness，非 criterion 采样模型，
# 而是单次运行全手牌链 + prove/verify 计时 + 对比报告）。
[[bench]]
name = "texas_poker_guest_full_hand"
harness = false
required-features = ["test-helpers"]
