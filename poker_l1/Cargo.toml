[package]
name = "poker_l1"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
poker_protocol = { workspace = true }
poker_zkvm = { workspace = true, features = ["test-helpers"] }
serde = { workspace = true }
serde_json = { workspace = true }
bcs = { workspace = true }
sha2 = { workspace = true }
blake2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
secp256k1 = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = { workspace = true }
rocksdb = { workspace = true }
solana_rbpf = { workspace = true }
blstrs = { workspace = true }
group = { workspace = true }
pairing = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 测试专用，避免影响生产二进制大小
tempfile = "3.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { workspace = true }
# 启用 poker_zkvm 的 test-helpers feature 以访问 generate_test_proof 等测试辅助函数
poker_zkvm = { workspace = true, features = ["test-helpers"] }

# ===== Task 36 性能基准（criterion harness = false）=====

[[bench]]
name = "task36_dag_consensus"
harness = false

[[bench]]
name = "task36_bls_syscall"
harness = false

[[bench]]
name = "task36_zk_verifier"
harness = false
