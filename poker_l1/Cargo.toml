[package]
name = "poker_l1"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
poker_protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bcs = { workspace = true }
sha2 = { workspace = true }
blake2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
secp256k1 = { workspace = true }
ed25519-dalek = { workspace = true }
