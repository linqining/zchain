[package]
name = "poker_l1"
version = "0.1.0"
edition = "2024"

[features]
# test-helpers：暴露 StubVrfVerifier 等测试专用类型，仅供集成测试 / 基准测试使用。
# 生产环境绝不可启用 — StubVrfVerifier 不执行真实 ECVRF-secp256k1 验证。
test-helpers = []
# client：暴露 prove_* 函数（ZK proof 生成端），供 CLI 客户端（poker-demo）使用。
# 生产节点不需要启用 — 节点只做 verify，prove 在客户端完成。
client = []

[lib]
path = "src/lib.rs"

[dependencies]
poker_protocol = { workspace = true }
poker_zkvm = { workspace = true, features = ["test-helpers"] }
vm-common = { path = "../vm-common" }
serde = { workspace = true }
serde_json = { workspace = true }
bcs = { workspace = true }
borsh = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
blake2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
secp256k1 = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = { workspace = true }
rocksdb = { workspace = true }
solana_rbpf = { workspace = true }
blstrs = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
pairing = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 测试专用，避免影响生产二进制大小
tempfile = "3.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { workspace = true }
# 启用 poker_zkvm 的 test-helpers feature 以访问 generate_test_proof 等测试辅助函数
poker_zkvm = { workspace = true, features = ["test-helpers"] }

# ===== Task 36 性能基准（criterion harness = false）=====

[[bench]]
name = "task36_dag_consensus"
harness = false

[[bench]]
name = "task36_bls_syscall"
harness = false
