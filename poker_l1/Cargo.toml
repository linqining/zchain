[package]
name = "poker_l1"
version = "0.1.0"
edition = "2024"

[features]
# test-helpers：暴露 StubVrfVerifier 等测试专用类型，仅供集成测试 / 基准测试使用。
# 生产环境绝不可启用 — StubVrfVerifier 不执行真实 ECVRF-secp256k1 验证。
test-helpers = []
# client：暴露 prove_* 函数（ZK proof 生成端），供 CLI 客户端（poker-demo）使用。
# 生产节点不需要启用 — 节点只做 verify，prove 在客户端完成。
client = []

[lib]
path = "src/lib.rs"

[dependencies]
# ===== 方案①：节点内 Cairo/Stwo 证明验证（poker_texas_air 同源 2.4.0 验证栈）=====
fact-verify = { path = "../../poker_texas_air/fact-verify" }
poker_protocol = { workspace = true }
vm-common = { path = "../vm-common" }
# 结算语义唯一事实源（plan-appchain §5.2-1）：settlement/side_pot/RIT 搬运目标 crate。
poker-settlement-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bcs = { workspace = true }
borsh = { workspace = true }
bincode = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
blake2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
# Vendored reconstruction V3 proof family（texas_poker/reconstruction_v3）的
# RNG trait 依赖，与 zgame poker_protocol 同版本（0.6.x），保证 trait 同一。
rand_core = { version = "0.6.4", features = ["getrandom"] }
secp256k1 = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = { workspace = true }
rocksdb = { workspace = true }
solana_rbpf = { workspace = true }
blstrs = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
pairing = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# 并行执行器（execute_block 波次化并发）：波次内无冲突 tx 经 rayon 线程池并发执行。
rayon = { workspace = true }
# ECVRF-secp256k1-SHA256-TAI（缺口 #2：替换 StubVrfVerifier）。
# `vrf` crate 提供 SECP256K1_SHA256_TAI 实现（基于 OpenSSL 后端）。
# 启用 openssl 的 vendored 特性：从源码编译 OpenSSL，避免依赖系统 OpenSSL
# （本机构建机仅 x86_64 系统 OpenSSL，vendored 保证 arm64 / CI 可复现构建）。
vrf = "0.2.5"
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
starknet-crypto = "0.8.1"
# 测试专用，避免影响生产二进制大小
tempfile = "3.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { workspace = true }

# ===== Task 36 性能基准（criterion harness = false）=====

[[bench]]
name = "task36_dag_consensus"
harness = false

[[bench]]
name = "task36_bls_syscall"
harness = false
