[package]
name = "fact-bridge"
version = "0.1.0"
edition = "2024"
description = "texas 手牌结算证明 → 4 节点 zchain 链上 fact 注册的桥接提交器"
license = "BUSL-1.1"

[dependencies]
poker_l1 = { path = "../poker_l1" }
fact-verify = { path = "../../poker_texas_air/fact-verify" }
poker_protocol = { workspace = true }
secp256k1 = { version = "0.29", features = ["recovery", "rand-std"] }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
borsh = "1"
serde_json = "1"
anyhow = "1"
